name: CI

on:
  push:
  pull_request:
  workflow_dispatch:


concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: 'Format (rustfmt)'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v4.3.1

    - name: Install Rust (stable + rustfmt)
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      with:
        toolchain: 1.96.0
        components: rustfmt

    - name: Rust cache
      uses: Swatinem/rust-cache@v2.9.2

    - name: cargo fmt --check
      run: cargo fmt --all --check

  clippy:
    name: 'Lint (clippy)'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@v4.3.1

    - name: Install Rust (stable + clippy)
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      with:
        toolchain: 1.96.0
        components: clippy

    - name: Install cargo-sqlx
      uses: taiki-e/install-action@v2.87.24
      with:
        tool: sqlx-cli@0.8.6

    - name: Rust cache
      uses: Swatinem/rust-cache@v2.9.2

    - name: cargo sqlx prepare --check
      run: cargo sqlx prepare --check

    - name: cargo clippy
      run: cargo clippy --all-targets -- -D warnings

  test:
    name: 'Test (${{ matrix.rust }}, ${{ matrix.os }})'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - rust: 1.96.0
          os: ubuntu-24.04
        - rust: 1.100.0-beta.2
          os: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4.3.1

    - name: Install Rust (${{ matrix.rust }})
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
      with:
        toolchain: ${{ matrix.rust }}

    - name: Install cargo-sqlx
      uses: taiki-e/install-action@v2.87.24
      with:
        tool: sqlx-cli@0.8.6

    - name: Rust cache
      uses: Swatinem/rust-cache@v2.9.2

    - name: cargo sqlx prepare --check
      run: cargo sqlx prepare --check

    - name: cargo test
      run: cargo test --all-targets
